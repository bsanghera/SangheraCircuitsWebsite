<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Meditation Editor</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://meditation-api.sangheracircuits.com; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="/meditation/admin/styles.css">
  <script src="/meditation/config.js" defer></script>
  <script src="/meditation/admin/simple-admin.js" defer></script>
</head>
<body>
  <section id="authGate" class="auth-panel" hidden>
    <h1>Meditation Journal</h1>
    <p class="muted">Sign in to edit your private journal.</p>
    <button id="loginBtn" class="btn" type="button">Login with GitHub</button>
  </section>

  <div id="editorApp" hidden>
    <header class="topbar">
      <div class="brand">Meditation Editor</div>
      <a href="/meditation/" class="center-link" title="Go to Meditation Journal">Meditation Journal</a>
      <div class="spacer"></div>
      <div id="viewerControls" class="viewer-controls" hidden>
        <label for="viewerSelect">Viewing</label>
        <select id="viewerSelect" aria-label="Journal user"></select>
      </div>
      <div id="userBadge" class="user-badge" hidden>
        <img id="userAvatar" alt="">
        <span id="userName"></span>
        <button id="logoutBtn" class="btn btn-ghost" type="button">Logout</button>
      </div>
    </header>

    <main class="container">
      <nav class="tabs">
        <button class="tab active" data-tab="entries" type="button">Entries</button>
        <button class="tab" data-tab="takeaways" type="button">Takeaways</button>
      </nav>

      <section id="tab-entries" class="tabpanel active">
        <div class="panel">
          <h2>New / Edit Entry</h2>
          <form id="entryForm" class="form">
            <label><span>Date</span><input type="date" id="entryDate" required></label>
            <label><span>Duration (min)</span><input type="number" min="1" max="1440" id="entryDuration" required></label>
            <label><span>Notes</span><textarea id="entryNotes" rows="6" maxlength="20000" placeholder="Reflections..."></textarea></label>
            <div class="actions"><button class="btn" type="submit">Save Entry</button></div>
          </form>
        </div>

        <div class="panel">
          <h2>Existing Entries</h2>
          <div id="entriesList" class="list">Loading…</div>
        </div>
      </section>

      <section id="tab-takeaways" class="tabpanel">
        <div class="panel">
          <h2>Key Findings</h2>
          <p class="muted">One per line.</p>
          <textarea id="takeawaysText" rows="10" style="width:100%"></textarea>
          <div class="actions"><button id="saveTakeawaysBtn" class="btn" type="button">Save Findings</button></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
