<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meditation Journal</title>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: https://avatars.githubusercontent.com;
                 connect-src 'self' https://meditation-api.sangheracircuits.com;
                 base-uri 'self';
                 form-action 'self'">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; background:#f5f1e8; color:#2c2416; line-height:1.6; padding:20px; }
    .container { max-width:900px; margin:0 auto; }
    header { text-align:center; margin-bottom:28px; padding-top:20px; }
    h1 { font-size:2.2em; font-weight:300; margin-bottom:8px; color:#1a1510; }
    .subtitle { font-size:1.05em; color:#6b5d4f; font-weight:300; }
    .account-bar { display:flex; align-items:center; justify-content:flex-end; gap:12px; min-height:38px; margin-bottom:8px; }
    .account-user { display:flex; align-items:center; gap:8px; color:#6b5d4f; font-size:.92rem; }
    .account-user img { width:28px; height:28px; border-radius:50%; }
    .ghost-btn { border:1px solid #e5dcc8; background:transparent; color:#2c2416; padding:7px 11px; border-radius:8px; cursor:pointer; }
    .ghost-btn:hover { background:#fff; }
    .viewer-controls { display:flex; align-items:center; gap:7px; }
    .viewer-controls label { color:#6b5d4f; font-size:.88rem; }
    .viewer-controls select { border:1px solid #e5dcc8; background:#fff; color:#2c2416; border-radius:8px; padding:6px 8px; }
    .auth-gate { max-width:480px; margin:12vh auto 0; background:#fff; border-radius:14px; padding:34px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    .auth-gate h1 { margin-bottom:10px; }
    .auth-message { color:#6b5d4f; margin-bottom:22px; }
    .login-btn { background:#2c2416; color:#fff; border:0; border-radius:9px; padding:11px 18px; cursor:pointer; font-size:1rem; }
    .stats-card { background:#fff; border-radius:12px; padding:24px; margin-bottom:28px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:18px; }
    .stat-item { text-align:center; }
    .stat-number { font-size:2.1em; font-weight:300; color:#8b7355; }
    .stat-label { font-size:.85em; color:#6b5d4f; text-transform:uppercase; letter-spacing:1px; }
    .takeaways { margin-top:12px; padding-top:18px; border-top:1px solid #e5dcc8; }
    .takeaways-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .takeaways h2 { font-size:1.2em; font-weight:500; color:#1a1510; }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:999px; border:1px solid #e5dcc8; background:transparent; color:#2c2416; text-decoration:none; font-size:1.2em; line-height:1; cursor:pointer; transition:background .15s ease,box-shadow .15s ease,border-color .15s ease; }
    .icon-btn:hover { background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); border-color:#d8cdb7; }
    .takeaways-content { background:#faf8f3; padding:16px 20px; border-radius:8px; border-left:3px solid #8b7355; }
    .takeaways-list { list-style:none; }
    .takeaways-list li { margin-bottom:10px; padding-left:22px; position:relative; font-size:1.06em; }
    .takeaways-list li:before { content:'•'; position:absolute; left:0; color:#8b7355; font-weight:bold; font-size:1.1em; }
    .sessions-list { margin-top:18px; }
    .session-card { background:#fff; border-radius:10px; padding:18px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.05); transition:box-shadow .2s; }
    .session-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .session-notes { color:#2c2416; line-height:1.7; font-size:1.05em; white-space:pre-wrap; margin-bottom:8px; }
    .session-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; color:#6b5d4f; font-size:.92em; }
    .session-duration { background:#f0e9db; padding:5px 12px; border-radius:20px; font-size:.9em; color:#6b5d4f; }
    .session-date { color:#7b6e60; font-size:.9em; }
    .empty-state { text-align:center; padding:40px 20px; color:#8b7355; }
    .empty-state p { font-size:1.05em; margin-bottom:12px; }
    [hidden] { display:none !important; }
    @media (max-width:600px) { h1{font-size:1.8em}.stats-grid{grid-template-columns:1fr}.session-meta{flex-wrap:wrap;gap:6px}.account-bar{flex-wrap:wrap}.viewer-controls{width:100%;justify-content:flex-end} }
  </style>

  <script src="/meditation/config.js" defer></script>
  <script src="/meditation/app.js" defer></script>
</head>
<body>
  <section id="authGate" class="auth-gate" hidden>
    <h1>Meditation Journal</h1>
    <p class="auth-message">Sign in to view your private journal.</p>
    <button id="loginBtn" class="login-btn" type="button">Login with GitHub</button>
  </section>

  <div id="journalApp" class="container" hidden>
    <div class="account-bar">
      <div id="viewerControls" class="viewer-controls" hidden>
        <label for="viewerSelect">Viewing</label>
        <select id="viewerSelect" aria-label="Journal user"></select>
      </div>
      <div class="account-user">
        <img id="userAvatar" alt="">
        <span id="userName"></span>
      </div>
      <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
    </div>

    <header>
      <h1>Meditation Journal</h1>
      <p class="subtitle">A space for reflection and growth</p>
    </header>

    <div class="stats-card">
      <div class="stats-grid">
        <div class="stat-item"><div class="stat-number" id="daysThisYear">0</div><div class="stat-label">Days This Year</div></div>
        <div class="stat-item"><div class="stat-number" id="totalSessions">0</div><div class="stat-label">Total Sessions</div></div>
        <div class="stat-item"><div class="stat-number" id="totalMinutes">0</div><div class="stat-label">Minutes</div></div>
      </div>
      <div class="takeaways">
        <div class="takeaways-header">
          <h2>Key Findings</h2>
          <a href="/meditation/admin/" class="icon-btn" aria-label="Add meditation session" title="Add meditation session">+</a>
        </div>
        <div class="takeaways-content"><ul class="takeaways-list" id="takeawaysList"></ul></div>
      </div>
    </div>

    <div class="sessions-list" id="sessionsList"></div>
  </div>
</body>
</html>
